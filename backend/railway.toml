[build]
builder = "NIXPACKS"
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = "python manage.py migrate && if [ \"$MIGRATE_LEGACY_ONCE\" = \"1\" ]; then python manage.py migrate_legacy_data; fi"
startCommand = "gunicorn umrah_link.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/api/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
